<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 471 50">
<title>The top wall from outside, to scale</title>
<desc>Display drawing, not a cut file. The top wall from outside, to scale, head end on the left, cut off 20mm past the lowest hole: its edges cut into fingers, left whole beside every opening; the bore's inside edges dotted beneath; the lip plate's outline dashed round the embouchure; the six finger holes named for their fingers with their sizes, round or longer along the flute; and the blue line where the cork's face goes.</desc>
<rect x="0" y="0" width="471.0" height="50.0" fill="#ffffff"/>
